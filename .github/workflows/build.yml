name: Build MyDownloader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: ls -la

      - name: Extract project
        run: unzip -q Mydownloader.zip

      - name: Check project
        run: ls -la MyDownloader

      - name: Make Gradle executable
        working-directory: MyDownloader
        run: chmod +x gradlew

      - name: Build APK
        working-directory: MyDownloader
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDownloader-APK
          path: MyDownloader/app/build/outputs/apk/debug/app-debug.apk
