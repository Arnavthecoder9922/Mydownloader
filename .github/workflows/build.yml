name: Build MyDownloader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q Mydownloader.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Clean activity XML
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          xml_file = project / "app" / "src" / "main" / "res" / "layout" / "activity_main.xml"

          if not xml_file.exists():
              raise SystemExit("activity_main.xml was not found")

          data = xml_file.read_text(encoding="utf-8-sig")

          # Remove anything before the XML declaration.
          position = data.find("<?xml")

          if position >= 0:
              data = data[position:]
          else:
              position = data.find("<")
              if position < 0:
                  raise SystemExit("No XML content found")
              data = data[position:]

          xml_file.write_text(data.strip() + "\n", encoding="utf-8")

          print("XML cleaned successfully")
          PY

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDownloader-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
