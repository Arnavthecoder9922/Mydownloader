name: Build MyDownloader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get ZIP
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q MyDownloader.zip
          cd MyDownloader
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: MyDownloader
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDownloader-APK
          path: MyDownloader/app/build/outputs/apk/debug/app-debug.apk
